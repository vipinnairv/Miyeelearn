<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiyeeUpskill - Learn, Assess, Certify</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230b2a5b%22/%3E%0A%3Crect%20x%3D%2214%22%20y%3D%2238%22%20width%3D%228%22%20height%3D%2214%22%20rx%3D%222%22%20fill%3D%22%23c8a24a%22/%3E%0A%3Crect%20x%3D%2228%22%20y%3D%2230%22%20width%3D%228%22%20height%3D%2222%22%20rx%3D%222%22%20fill%3D%22%23e0c070%22/%3E%0A%3Crect%20x%3D%2242%22%20y%3D%2220%22%20width%3D%228%22%20height%3D%2232%22%20rx%3D%222%22%20fill%3D%22%23c8a24a%22/%3E%0A%3Cpath%20d%3D%22M38%2020%20l8%20-10%20l8%2010%20z%22%20fill%3D%22%23e0c070%22/%3E%0A%3C/svg%3E">
<style>
:root{
  --jgu-navy:#0b2a5b;--jgu-blue:#123a7a;--jgu-accent:#c8a24a;--jgu-gold:#c8a24a;
  --jgu-sky:#82c8de;--jgu-light:#f4f7fb;--jgu-red:#8b1e2d;--text:#1c2733;
  --muted:#6a7788;--border:#dbe2ec;--ok:#1f8a4c;--warn:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--jgu-light);color:var(--text);line-height:1.5}
img{max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;font-size:14px}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
a{color:var(--jgu-blue);cursor:pointer}

.topbar{background:#fff;border-bottom:3px solid var(--jgu-accent);box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:46px}
.brand-txt{font-size:12px;color:var(--muted);border-left:2px solid var(--border);padding-left:12px;line-height:1.3}
.brand-txt b{color:var(--jgu-navy);font-size:14px;display:block}
.nav-user{display:flex;align-items:center;gap:14px;font-size:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--jgu-navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.btn{background:var(--jgu-navy);color:#fff;padding:9px 18px;border-radius:6px;font-weight:600;transition:.15s}
.btn:hover{background:var(--jgu-blue)}
.btn-gold{background:var(--jgu-accent);color:#1c2733}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--jgu-navy);border:1.5px solid var(--jgu-navy)}
.btn-ghost:hover{background:var(--jgu-navy);color:#fff}
.btn-danger{background:#fff;color:var(--warn);border:1.5px solid var(--warn)}
.btn-danger:hover{background:var(--warn);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--jgu-navy),var(--jgu-blue) 60%,#1a4a94);padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:940px;display:flex;overflow:hidden;min-height:540px}
.login-left{flex:1.1;background:linear-gradient(160deg,var(--jgu-navy),#1a4a94);color:#fff;padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.login-left .lg-logo{background:#fff;padding:14px 16px;border-radius:10px;display:inline-block;margin-bottom:26px;align-self:flex-start}
.login-left .lg-logo img{height:52px;display:block}
.login-left h1{font-size:25px;line-height:1.3;margin-bottom:14px}
.login-left p{opacity:.9;font-size:14px;margin-bottom:22px}
.login-left ul{list-style:none;font-size:14px;opacity:.95}
.login-left ul li{padding:6px 0 6px 26px;position:relative}
.login-left ul li:before{content:"\2713";position:absolute;left:0;color:var(--jgu-accent);font-weight:700}
.login-right{flex:1;padding:40px;display:flex;flex-direction:column;justify-content:center}
.login-right h2{color:var(--jgu-navy);font-size:22px;margin-bottom:6px}
.login-right .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--jgu-navy);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--jgu-blue)}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role-tabs{display:flex;gap:8px;margin-bottom:20px}
.role-tabs button{flex:1;padding:9px;border:1.5px solid var(--border);background:#fff;border-radius:8px;font-weight:600;color:var(--muted)}
.role-tabs button.active{border-color:var(--jgu-navy);background:var(--jgu-navy);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;background:var(--jgu-light);padding:10px;border-radius:8px}
.err{color:var(--warn);font-size:13px;margin-top:10px;font-weight:600}

.app-shell{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-head h1{color:var(--jgu-navy);font-size:23px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumb a:hover{text-decoration:underline}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--border);border-top:3px solid var(--jgu-accent)}
.stat .n{font-size:26px;font-weight:700;color:var(--jgu-navy)}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}

.card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden}
.card-h{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;color:var(--jgu-navy);display:flex;justify-content:space-between;align-items:center}
.card-b{padding:20px}

.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.course-card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(11,42,91,.12)}
.course-banner{height:120px;background:linear-gradient(135deg,var(--jgu-navy),#1a4a94);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.course-banner .tag{align-self:flex-start;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.course-banner h3{font-size:16px;line-height:1.3}
.course-body{padding:16px 18px;flex:1;display:flex;flex-direction:column}
.course-meta{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap}
.progress-bar{height:8px;background:var(--jgu-light);border-radius:20px;overflow:hidden;margin-bottom:6px}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jgu-accent),#e0c070);border-radius:20px}
.computed-out{font-size:20px;font-weight:700;color:var(--jgu-navy);background:var(--jgu-light);border:1.5px dashed var(--border);border-radius:8px;padding:10px 14px;display:inline-block;min-width:120px}
.computed-out.good{color:#1f8a4c;border-color:#1f8a4c;background:#eef7f0}
.computed-out.ok{color:#b7791f;border-color:#d9b45f;background:#fef8ec}
.computed-out.bad{color:#c0392b;border-color:#e0a99f;background:#fdecea}
.progress-lbl{font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between}
.course-body .btn{margin-top:auto;text-align:center}

.two-col{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.module{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.module-h{background:var(--jgu-light);padding:14px 18px;font-weight:700;color:var(--jgu-navy);display:flex;justify-content:space-between;align-items:center}
.module-h .mstat{font-size:12px;font-weight:600;color:var(--muted)}
.lesson{padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer}
.lesson:hover{background:#fafbfd}
.lesson .ic{width:30px;height:30px;border-radius:50%;background:var(--jgu-light);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.lesson.done .ic{background:var(--ok);color:#fff}
.lesson .lt{flex:1}.lesson .lt b{font-size:14px;display:block}.lesson .lt span{font-size:12px;color:var(--muted)}
.lesson .lk{font-size:12px;color:var(--jgu-blue);font-weight:600}

.side-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;position:sticky;top:90px}
.side-card h4{color:var(--jgu-navy);font-size:15px;margin-bottom:14px}
.side-stat{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--border)}
.side-stat:last-of-type{border:none}

.viewer{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.video-ph{background:#0b1220;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
.play-btn{width:70px;height:70px;border-radius:50%;background:var(--jgu-accent);display:flex;align-items:center;justify-content:center;font-size:26px;color:#1c2733;cursor:pointer}
.video-ph video,.video-ph iframe{width:100%;height:100%;border:none}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.vwrap video,.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.lesson-body{padding:26px 30px}
.lesson-body h2{color:var(--jgu-navy);margin-bottom:14px}
.lesson-body p{margin-bottom:14px;color:#334}
.lesson-nav{display:flex;justify-content:space-between;padding:20px 30px;border-top:1px solid var(--border)}

.quiz-head{background:linear-gradient(135deg,var(--jgu-navy),#1a4a94);color:#fff;border-radius:12px;padding:24px 28px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.quiz-head h1{font-size:22px;margin-bottom:4px}.quiz-head .qmeta{font-size:13px;opacity:.9}
.timer{background:rgba(255,255,255,.15);padding:10px 20px;border-radius:10px;text-align:center}
.timer .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.timer .l{font-size:11px;opacity:.85}
.timer.warn{background:var(--jgu-red)}
.q-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px 28px;margin-bottom:18px}
.q-num{font-size:12px;font-weight:700;color:var(--jgu-accent);letter-spacing:.5px}
.q-text{font-size:16px;font-weight:600;margin:6px 0 18px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--border);border-radius:9px;margin-bottom:10px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--jgu-blue);background:#fafbff}
.opt.sel{border-color:var(--jgu-navy);background:#eef3fb}
.opt .radio{width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;flex-shrink:0;position:relative}
.opt.sel .radio{border-color:var(--jgu-navy)}
.opt.sel .radio:after{content:"";position:absolute;inset:3px;background:var(--jgu-navy);border-radius:50%}
.opt .ol{font-weight:700;color:var(--muted);width:20px}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 24px;position:sticky;bottom:16px;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.q-palette{display:flex;gap:8px;flex-wrap:wrap}
.q-palette button{width:34px;height:34px;border-radius:7px;border:1.5px solid var(--border);background:#fff;font-weight:600;font-size:13px}
.q-palette button.answered{background:var(--ok);color:#fff;border-color:var(--ok)}
.q-palette button.current{border-color:var(--jgu-navy);border-width:2px}

.result-hero{text-align:center;padding:30px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:24px}
.result-hero .badge{width:90px;height:90px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:42px}
.badge.pass{background:#e8f6ee;color:var(--ok)}.badge.fail{background:#fdecea;color:var(--warn)}
.result-hero h1{color:var(--jgu-navy);font-size:26px}
.score-big{font-size:46px;font-weight:800;color:var(--jgu-navy);margin:6px 0}
.result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.result-stats .rs{background:var(--jgu-light);border-radius:10px;padding:14px}
.result-stats .rs .n{font-size:22px;font-weight:700;color:var(--jgu-navy)}.result-stats .rs .l{font-size:12px;color:var(--muted)}

.sheet{background:#fff;border:1px solid var(--border);max-width:820px;margin:0 auto}
.sheet-head{border-bottom:3px double var(--jgu-navy);padding:26px 40px;display:flex;align-items:center;gap:20px}
.sheet-head img{height:64px}.sheet-head .sh-txt h2{color:var(--jgu-navy);font-size:20px}.sheet-head .sh-txt p{font-size:12.5px;color:var(--muted)}
.sheet-title{text-align:center;padding:16px;background:var(--jgu-navy);color:#fff;font-size:16px;font-weight:700;letter-spacing:1px}
.sheet-body{padding:30px 40px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-bottom:24px;font-size:14px}
.info-grid .r{display:flex;justify-content:space-between;border-bottom:1px dotted var(--border);padding:6px 0}
.info-grid .r b{color:var(--jgu-navy)}
table.marks{width:100%;border-collapse:collapse;font-size:13.5px}
table.marks th{background:var(--jgu-navy);color:#fff;padding:10px 12px;text-align:left}
table.marks td{padding:9px 12px;border:1px solid var(--border)}
table.marks tr:nth-child(even){background:var(--jgu-light)}
table.marks tfoot td{font-weight:700;background:#eef3fb}
.grade-pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
.sheet-foot{padding:24px 40px;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--muted)}
.sign{text-align:center}.sign .line{border-top:1.5px solid var(--text);width:170px;margin-bottom:5px;padding-top:5px}

.cert-pages{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.cert-page{background:#fff;width:520px;min-height:720px;position:relative;padding:0;border:1px solid #cfd6e0;box-shadow:0 8px 30px rgba(0,0,0,.10)}
.cert-inner{padding:40px 46px;text-align:center;position:relative;height:100%}
.cert-toprow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.cert-logobox{flex:1;text-align:center;padding-top:6px}
.cert-logobox img{height:90px}
.cert-photo{width:110px;height:130px;border:1.5px solid #222;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#555;text-align:center;line-height:1.4;flex-shrink:0;overflow:hidden}
.cert-photo img{width:100%;height:100%;object-fit:cover}
.cert-body p{font-size:13.5px;font-weight:700;line-height:1.5;margin-bottom:12px}
.cert-field{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#0b2a5b;margin:6px 0 12px;letter-spacing:.5px}
.cert-field.big{font-size:24px}
.cert-uni-name{font-size:15px;font-weight:700;color:#0b2a5b;line-height:1.4;margin:6px 0 12px}
.cert-witness{font-size:12.5px;font-weight:700;line-height:1.55;margin-top:22px}
.cert-signs{display:flex;justify-content:space-around;margin-top:40px;padding:0 4px;gap:12px;align-items:flex-end}
.cert-signs .s{min-width:110px;max-width:150px;text-align:center}
.cert-signs .sig-img{height:40px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:3px}
.cert-signs .sig-img img{max-height:40px;max-width:130px}
.cert-signs .s .name{font-style:italic;font-size:13px;border-top:1px solid #333;padding-top:5px}
.cert-back{text-align:left;padding-top:70px}
.cert-back ol{margin:0 0 24px 20px;font-size:14px;line-height:2}
.cert-back ol li{font-weight:700;padding-left:6px}
.cert-back ol li span{font-weight:400;color:#333}
.cert-idblock{font-size:14px;font-weight:700;line-height:1.7;margin-top:10px}
.cert-idblock span{font-weight:400;color:#333;display:block;margin-top:6px;border-bottom:1px dotted #999;min-height:22px}
.cert-verify{position:absolute;bottom:24px;left:46px;right:46px;font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-align:center;border-top:1px solid var(--border);padding-top:10px}

.action-bar{display:flex;gap:12px;justify-content:center;margin:24px 0;flex-wrap:wrap}
.demo-note{max-width:1064px;margin:0 auto 18px;background:#eef7f0;border:1px solid #cfe6d6;border-radius:8px;padding:12px 16px;font-size:12.5px;color:#25603f}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
.tabs button{padding:11px 18px;background:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--jgu-navy);border-bottom-color:var(--jgu-accent)}
table.data{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
table.data th{background:var(--jgu-light);color:var(--jgu-navy);padding:12px 14px;text-align:left;font-size:12.5px;border-bottom:2px solid var(--border)}
table.data td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tr:hover td{background:#fafbfd}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600}
.pill.green{background:#e8f6ee;color:var(--ok)}.pill.amber{background:#fef6e0;color:#b7791f}
.pill.red{background:#fdecea;color:var(--warn)}.pill.blue{background:#e8f0fc;color:var(--jgu-blue)}
.pill.gray{background:#eef1f5;color:var(--muted)}

.modal-bg{position:fixed;inset:0;background:rgba(11,26,45,.55);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{max-width:820px}
.modal-h{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{color:var(--jgu-navy);font-size:18px}
.modal-h .x{background:none;font-size:24px;color:var(--muted);line-height:1}
.modal-b{padding:24px;max-height:65vh;overflow-y:auto}
.modal-f{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

.mini-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;padding:9px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
.q-editor{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;background:#fafbfd}
.q-editor .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-editor .qh b{color:var(--jgu-navy)}
.opt-edit{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.opt-edit input[type=text]{flex:1;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px}
.opt-edit label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.badge-correct{background:var(--ok);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.mod-edit{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}

  if(S0.verifyUrl===undefined) S0.verifyUrl="verify.miyeeupskill.com";
  // ensure per-question marks defaults on all questions
  db.courses.forEach(c=>{
    // v2->v3: wrap flat course (modules+assessment) into semesters[]
    if(!Array.isArray(c.semesters)){
      c.semesters = [{
        id: (c.id||'c')+'_s1',
        name: 'Semester 1',
        modules: Array.isArray(c.modules)?c.modules:[],
        assessment: c.assessment || {title:'Semester 1 Assessment',passMark:(db.settings.defaultPassMark||50),durationMins:20,questions:[]}
      }];
    }
    // normalise each semester
    c.semesters.forEach((sem,si)=>{
      if(!sem.id) sem.id=(c.id||'c')+'_s'+(si+1);
      if(!sem.name) sem.name='Semester '+(si+1);

      sem.modules.forEach(m=>(m.lessons||[]).forEach(l=>{ if(l.video==null) l.video=""; }));
    });
    // keep legacy fields for any old refs but they are no longer primary
  });
  db.students.forEach(s=>{ if(!Array.isArray(s.enrolled)) s.enrolled=[]; if(s.photo==null) s.photo=""; });
  db._v = SCHEMA_VERSION;
  return db;
}

/* Robust save with quota detection; returns true/false */
function saveDB(silent){
  try{
    localStorage.setItem(SK, JSON.stringify(DB));
    return true;
  }catch(e){
    const quota = e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014 || /quota/i.test(e.message||''));
    if(!silent) toast(quota?'⚠ Storage is full, export a backup then remove large photos/videos':'Storage blocked (try a normal browser window)','err');
    return false;
  }
}

/* Storage usage estimate (localStorage cap is ~5MB in most browsers) */
function storageUsage(){
  let bytes=0;
  try{ const raw=localStorage.getItem(SK)||''; bytes = new Blob([raw]).size; }catch(e){}
  const cap = 5*1024*1024; // ~5MB typical
  return { bytes, cap, pct: Math.min(100, Math.round(bytes/cap*100)), kb:(bytes/1024).toFixed(0) };
}

// reseed so the correct MiyeeUpskill accounts and courses always exist.

/* ---------- helpers ---------- */
function uid(p){ return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function findCourse(id){ return DB.courses.find(c=>c.id===id); }
function findStudent(id){ return DB.students.find(s=>s.id===id); }
/* ---- semester-aware helpers ---- */
function courseSemesters(c){ return Array.isArray(c.semesters)?c.semesters:[]; }
function findSemester(c,semId){ return courseSemesters(c).find(s=>s.id===semId); }
function semLessons(sem){ return (sem.modules||[]).flatMap(m=>m.lessons||[]); }
function flatLessons(c){ return courseSemesters(c).flatMap(sem=>semLessons(sem)); } // whole course
function lessonCount(c){ return flatLessons(c).length; }
function semLessonCount(sem){ return semLessons(sem).length; }
function nextStudentId(){
  const yr=new Date().getFullYear().toString().slice(2);
  const nums=DB.students.map(s=>parseInt((s.id.split('-')[3]||'1000'),10)).filter(n=>!isNaN(n));
  const max=nums.length?Math.max(...nums):1000;
  return "MU-"+yr+"-"+(max+1);
}
function getProgress(sid,cid){ return (DB.progress[sid]&&DB.progress[sid][cid])||{done:[]}; }
function setLessonDone(sid,cid,lid){
  DB.progress[sid]=DB.progress[sid]||{};
  DB.progress[sid][cid]=DB.progress[sid][cid]||{done:[]};
  if(!DB.progress[sid][cid].done.includes(lid)) DB.progress[sid][cid].done.push(lid);
  saveDB();
}
function courseProgress(sid,c){
  const total=lessonCount(c);
  const done=getProgress(sid,c.id).done.length;
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function semProgress(sid,c,sem){
  const lessons=semLessons(sem);
  const done=getProgress(sid,c.id).done;
  const d=lessons.filter(l=>done.includes(l.id)).length;
  return {total:lessons.length,done:d,pct:lessons.length?Math.round(d/lessons.length*100):0};
}
/* attempt keys: semester attempts use "cid::semId" */
function attKey(cid,semId){ return cid+"::"+semId; }
function getAttempt(sid,cid){ return DB.attempts[sid]&&DB.attempts[sid][cid]; } // legacy/course-level
function getSemAttempt(sid,cid,semId){ return DB.attempts[sid]&&DB.attempts[sid][attKey(cid,semId)]; }
function saveAttempt(sid,cid,att){ DB.attempts[sid]=DB.attempts[sid]||{}; DB.attempts[sid][cid]=att; saveDB(); }
function saveSemAttempt(sid,cid,semId,att){ DB.attempts[sid]=DB.attempts[sid]||{}; DB.attempts[sid][attKey(cid,semId)]=att; saveDB(); }
function allSemestersPassed(sid,c){
  const sems=courseSemesters(c);
  if(!sems.length) return false;
  return sems.every(sem=> getSemAttempt(sid,c.id,sem.id)?.passed );
}
function semUnlocked(sid,c,idx){
  // semester i unlocked if all previous semesters passed
  const sems=courseSemesters(c);
  for(let i=0;i<idx;i++){ if(!getSemAttempt(sid,c.id,sems[i].id)?.passed) return false; }
  return true;
}
function gradeFor(pct){
  const gs=(DB.settings&&DB.settings.gradeScale)||{A:80,B:70,C:60,D:50};
  if(pct>=gs.A) return {g:"A",label:"Outstanding",color:"#1f8a4c"};
  if(pct>=gs.B) return {g:"B",label:"Very Good",color:"#2d7d46"};
  if(pct>=gs.C) return {g:"C",label:"Good",color:"#b7791f"};
  if(pct>=gs.D) return {g:"D",label:"Pass",color:"#c07a1f"};
  return {g:"F",label:"Fail",color:"#c0392b"};
}
function certId(){ const px=(DB.settings&&DB.settings.certPrefix)||"MU"; return px+"/"+new Date().getFullYear()+"/"+Math.floor(100000+Math.random()*899999); }
function today(){ return new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(type==='err'?' err':''); setTimeout(()=>t.className='toast',2600); }

function renderCourse(){

      <div class="card-h" style="background:${att?.passed?'#eef7f0':'var(--jgu-light)'}">

      <h3 style="color:var(--jgu-navy);margin-bottom:14px">Semesters</h3>${semBlocks}

function openLesson(lid){ S.lessonId=lid; go('lesson'); }
function videoEmbed(l){
  if(!l.video) return `<div class="video-ph"><div class="play-btn">▶</div><div style="font-size:13px;opacity:.7">${l.type==='video'?'Lecture Video':'Reading Material'} · ${l.mins} min</div><div style="font-size:11px;opacity:.5">No video uploaded yet. Admin can add one</div></div>`;
  const v=l.video.trim();
  const yt=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  if(yt) return `<div class="vwrap"><iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe></div>`;
  const vm=v.match(/vimeo\.com\/(\d+)/);
  if(vm) return `<div class="vwrap"><iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen></iframe></div>`;
  return `<div class="vwrap"><video src="${esc(v)}" controls></video></div>`;
}

/* ---- Worksheet response storage: DB.worksheets[studentId][lessonId] = {answers:{fieldId:text}, status, mentorNote, submittedAt} ---- */

function saveWorksheetResponse(sid,lid,answers,status){

      }
      if(ft==='shorttext'){

      }
      return `<div class="field"><label>${esc(f.label)}${hint}</label><textarea id="wf-${fi}" rows="${f.rows||3}" oninput="onWsInput('${l.id}')">${esc(val)}</textarea></div>`;
    }).join('');
    const statusPill = resp
      ? `<span class="pill ${resp.reviewed?'green':'amber'}">${resp.reviewed?'✓ Reviewed by mentor':'Submitted, awaiting review'}</span>`
      : `<span class="pill gray">Not yet submitted</span>`;
    const mentorFeedback = resp?.mentorNote
      ? `<div class="card" style="margin-top:16px;border-color:var(--jgu-accent)"><div class="card-h" style="background:#fef8ec">🧑‍🏫 Mentor Feedback</div><div class="card-b" style="white-space:pre-wrap">${esc(resp.mentorNote)}</div></div>`
      : '';
    app().innerHTML=topbar()+`<div class="app-shell">
      <div class="crumb"><a onclick="go('dashboard')">Dashboard</a> / <a onclick="openCourse('${c.id}')">${esc(c.title)}</a> / ${esc(l.title)}</div>
      <div class="two-col"><div class="viewer">
        <div class="lesson-body">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 style="margin-bottom:0">📝 ${esc(l.title)}</h2>${statusPill}</div>

/* ---- worksheet drafts (local-first autosave) ---- */
function getWorksheetDraft(sid,lid){ return (DB.wsDrafts&&DB.wsDrafts[sid]&&DB.wsDrafts[sid][lid])||null; }
function readWorksheetInputs(l){
  const answers={};
  (l.fields||[]).forEach((f,fi)=>{
    if((f.ftype||'longtext')==='computed'){ const el=document.getElementById('wf-'+fi); answers[fi]=el?el.getAttribute('data-val')||'':''; }
    else { const el=document.getElementById('wf-'+fi); answers[fi]=el?el.value:''; }
  });
  return answers;
}
function computeField(l,f,answers){
  const a=parseFloat(answers[f.refA]), b=parseFloat(answers[f.refB]);
  if(isNaN(a)||isNaN(b)) return null;
  let r=null;
  if(f.formula==='wow'){ if(a===0) return null; r=((b-a)/a)*100; }
  else if(f.formula==='ratio'){ if(b===0) return null; r=a/b; }
  else if(f.formula==='diff'){ r=a-b; }
  else if(f.formula==='sum'){ r=a+b; }
  if(r==null) return null;
  return Math.round(r*100)/100;
}
function recalcWorksheet(lid){
  const s=S.user, c=findCourse(S.courseId), l=flatLessons(c).find(x=>x.id===lid);
  if(!l) return;
  const answers=readWorksheetInputs(l);
  // update computed outputs
  (l.fields||[]).forEach((f,fi)=>{
    if((f.ftype||'longtext')==='computed'){
      const el=document.getElementById('wf-'+fi); if(!el) return;
      const r=computeField(l,f,answers);
      if(r==null){ el.textContent='- - -'; el.removeAttribute('data-val'); el.className='computed-out'; }
      else{
        const suffix=f.unit?(' '+f.unit):'';
        el.textContent=(r>0&&f.formula==='wow'?'+':'')+r+suffix;
        el.setAttribute('data-val', r+(f.unit||''));
        // colour cue for growth
        el.className='computed-out '+(f.formula==='wow'?(r>=5?'good':(r>=0?'ok':'bad')):'ok');
      }
    }
  });
  // completion meter (non-computed fields with content)
  const inputFields=(l.fields||[]).filter(f=>(f.ftype||'longtext')!=='computed');
  const filled=inputFields.filter((f,i)=>{ const fi=(l.fields||[]).indexOf(f); const v=answers[fi]; return v!=null&&(''+v).trim(); }).length;
  const pct=inputFields.length?Math.round(filled/inputFields.length*100):0;
  const meter=document.getElementById('ws-meter'), lbl=document.getElementById('ws-meter-lbl');
  if(meter) meter.style.width=pct+'%';
  if(lbl) lbl.textContent=pct+'% complete';
}
let wsSaveTimer=null;
function onWsInput(lid){
  recalcWorksheet(lid);
  clearTimeout(wsSaveTimer);
  wsSaveTimer=setTimeout(()=>{
    const s=S.user, c=findCourse(S.courseId), l=flatLessons(c).find(x=>x.id===lid);
    const answers=readWorksheetInputs(l);
    DB.wsDrafts=DB.wsDrafts||{}; DB.wsDrafts[s.id]=DB.wsDrafts[s.id]||{};
    DB.wsDrafts[s.id][lid]=answers; saveDB(true);
    const sv=document.getElementById('ws-saved'); if(sv){ sv.style.opacity='1'; setTimeout(()=>{ if(sv) sv.style.opacity='0'; },1500); }
  },600);
}
function submitWorksheet(lid){
  const s=S.user, c=findCourse(S.courseId);
  const all=flatLessons(c); const l=all.find(x=>x.id===lid);
  const answers=readWorksheetInputs(l);
  const inputFields=(l.fields||[]).filter(f=>(f.ftype||'longtext')!=='computed');
  const filled=inputFields.filter((f)=>{ const fi=(l.fields||[]).indexOf(f); const v=answers[fi]; return v!=null&&(''+v).trim(); }).length;
  if(filled===0){ toast('Please fill in at least one field before submitting','err'); return; }
  saveWorksheetResponse(s.id,lid,answers,'submitted');
  // clear draft now that it's submitted
  if(DB.wsDrafts&&DB.wsDrafts[s.id]) delete DB.wsDrafts[s.id][lid];
  setLessonDone(s.id,c.id,lid);
  saveDB();
  toast('Worksheet submitted ✓ Your mentor will review it');
  const sems=courseSemesters(c);
  let semOf=null, semLes=null, li=-1;
  for(const sem of sems){ const ls=semLessons(sem); const k=ls.findIndex(x=>x.id===lid); if(k>=0){ semOf=sem; semLes=ls; li=k; break; } }
  if(semOf && li<semLes.length-1) openLesson(semLes[li+1].id); else openCourse(c.id);
}
function completeLesson(lid){
  const s=S.user, c=findCourse(S.courseId);
  setLessonDone(s.id,c.id,lid);
  // find which semester this lesson belongs to, advance within it
  const sems=courseSemesters(c);
  let semOf=null, semLes=null, li=-1;
  for(const sem of sems){ const ls=semLessons(sem); const k=ls.findIndex(l=>l.id===lid); if(k>=0){ semOf=sem; semLes=ls; li=k; break; } }
  if(semOf && li<semLes.length-1){ openLesson(semLes[li+1].id); toast('Lesson completed ✓'); }
  else { const sp=semProgress(s.id,c,semOf); if(sp.pct===100) toast('🎉 Semester lessons done! Assessment unlocked.'); openCourse(c.id); }
}
</script>
<script>

/* ============================================================
   QUIZ ENGINE + RESULT + MARKSHEET + CERTIFICATE
   ============================================================ */
function startSemQuiz(cid,semId){
  const c=findCourse(cid), sem=findSemester(c,semId);
  S.courseId=cid;
  S.quiz={cid,semId,answers:{},idx:0,timeLeft:sem.assessment.durationMins*60,timerId:null};
  go('quiz'); startTimer();
}
function quizSemester(){ const c=findCourse(S.quiz.cid); return findSemester(c,S.quiz.semId); }
function startTimer(){
  const q=S.quiz; clearInterval(q.timerId);
  q.timerId=setInterval(()=>{
    q.timeLeft--;
    const el=document.getElementById('timer-val');
    if(el){ el.textContent=fmtTime(q.timeLeft); if(q.timeLeft<=60) document.getElementById('timer-box').classList.add('warn'); }
    if(q.timeLeft<=0){ clearInterval(q.timerId); toast('Time up, submitting'); submitQuiz(); }
  },1000);
}
function fmtTime(s){ const m=Math.floor(s/60),ss=s%60; return `${m}:${ss<10?'0':''}${ss}`; }
function renderQuiz(){
  const c=findCourse(S.quiz.cid), sem=quizSemester(), A=sem.assessment, q=S.quiz, qn=A.questions[q.idx];
  const opts=qn.opts.map((o,i)=>{const sel=q.answers[q.idx]===i;return `<div class="opt ${sel?'sel':''}" onclick="pick(${q.idx},${i})"><div class="radio"></div><div class="ol">${String.fromCharCode(65+i)}</div><div>${esc(o)}</div></div>`;}).join('');
  const palette=A.questions.map((_,i)=>`<button class="${q.answers[i]!==undefined?'answered':''} ${i===q.idx?'current':''}" onclick="jump(${i})">${i+1}</button>`).join('');
  const answered=Object.keys(q.answers).length;
  app().innerHTML=topbar()+`<div class="app-shell">
    <div class="quiz-head"><div><h1>${esc(sem.name)} - ${esc(A.title)}</h1><div class="qmeta">${esc(c.title)} · ${A.questions.length} questions · Pass ${A.passMark}%</div></div>
      <div class="timer" id="timer-box"><div class="t" id="timer-val">${fmtTime(q.timeLeft)}</div><div class="l">TIME REMAINING</div></div></div>
    <div class="q-card"><div class="q-num">QUESTION ${q.idx+1} OF ${A.questions.length}</div><div class="q-text">${esc(qn.q)}</div>${opts}</div>
    <div class="quiz-foot"><div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">${answered}/${A.questions.length} answered</div><div class="q-palette">${palette}</div></div>
      <div style="display:flex;gap:10px">
        ${q.idx>0?`<button class="btn btn-ghost" onclick="jump(${q.idx-1})">← Prev</button>`:''}
        ${q.idx<A.questions.length-1?`<button class="btn" onclick="jump(${q.idx+1})">Next →</button>`:`<button class="btn btn-gold" onclick="confirmSubmit()">Submit ✓</button>`}
      </div></div></div>`;
}
function pick(qi,oi){ S.quiz.answers[qi]=oi; render(); }
function jump(i){ S.quiz.idx=i; render(); }
function confirmSubmit(){
  const A=quizSemester().assessment;
  const un=A.questions.length-Object.keys(S.quiz.answers).length;
  if(un>0 && !confirm(un+' question(s) unanswered. Submit anyway?')) return;
  submitQuiz();
}
function submitQuiz(){
  const q=S.quiz; clearInterval(q.timerId);
  const s=S.user, c=findCourse(q.cid), sem=findSemester(c,q.semId), A=sem.assessment;
  let correct=0, scored=0, maxMarks=0;
  A.questions.forEach((qn,i)=>{
    const m=qn.marks!=null?qn.marks:1, neg=qn.neg!=null?qn.neg:0;
    maxMarks+=m;
    if(q.answers[i]===qn.correct){ correct++; scored+=m; }
    else if(q.answers[i]!=null){ scored-=neg; }
  });
  if(scored<0) scored=0;
  const total=A.questions.length;
  const pct=maxMarks?Math.round(scored/maxMarks*100):0;
  const passed=pct>=A.passMark, g=gradeFor(pct);
  // mark this semester's lessons done
  semLessons(sem).forEach(l=>setLessonDone(s.id,c.id,l.id));
  saveSemAttempt(s.id,c.id,q.semId,{semId:q.semId,semName:sem.name,correct,total,scored,maxMarks,pct,passed,grade:g.g,gradeLabel:g.label,gradeColor:g.color,certId:certId(),date:today(),answers:{...q.answers}});
  S.resultSemId=q.semId;
  go('result');
}
function renderResult(){
  const s=S.user, c=findCourse(S.courseId);
  const semId=S.resultSemId, sem=findSemester(c,semId);
  const a=getSemAttempt(s.id,c.id,semId);
  const allDone=allSemestersPassed(s.id,c);
  app().innerHTML=topbar()+`<div class="app-shell">
    <div class="result-hero"><div class="badge ${a.passed?'pass':'fail'}">${a.passed?'✓':'✕'}</div>
      <h1>${a.passed?'Congratulations! You Passed '+esc(sem.name):esc(sem.name)+' Not Cleared'}</h1>
      <div class="score-big">${a.pct}%</div>
      <div style="color:var(--muted)">${a.correct} of ${a.total} correct · ${a.scored!=null?a.scored+' / '+a.maxMarks+' marks · ':''}Grade ${a.grade} (${a.gradeLabel})</div>
      <div class="result-stats">
        <div class="rs"><div class="n">${a.correct}</div><div class="l">Correct</div></div>
        <div class="rs"><div class="n">${a.total-a.correct}</div><div class="l">Incorrect</div></div>
        <div class="rs"><div class="n">${a.scored!=null?a.scored+'/'+a.maxMarks:a.pct+'%'}</div><div class="l">Marks</div></div>
        <div class="rs"><div class="n" style="color:${a.gradeColor}">${a.grade}</div><div class="l">Grade</div></div>
      </div></div>

      <button class="btn btn-ghost" onclick="viewSemMarksheet('${c.id}','${semId}')">📋 ${esc(sem.name)} Marksheet</button>

        ? (allDone

    </div></div>`;
}
function retakeSem(cid,semId){ if(DB.attempts[S.user.id]) delete DB.attempts[S.user.id][attKey(cid,semId)]; saveDB(); startSemQuiz(cid,semId); }
function viewSemMarksheet(cid,semId){ S.courseId=cid; S.resultSemId=semId; go('marksheet'); }

function renderMarksheet(){
  const s=S.user, c=findCourse(S.courseId);
  const semId=S.resultSemId, sem=findSemester(c,semId);
  const a=getSemAttempt(s.id,c.id,semId), A=sem.assessment;
  const gs=DB.settings.gradeScale;
  let remaining=a.correct;
  const mods=sem.modules||[];
  const rows=mods.map((m,i)=>{
    const isLast=i===mods.length-1;
    const max=Math.max(1,Math.round(A.questions.length/Math.max(1,mods.length)));
    let got=isLast?remaining:Math.min(max,Math.round(a.correct*(max/Math.max(1,A.questions.length))));
    remaining-=got; if(remaining<0)remaining=0;
    const pct=Math.round(got/max*100), g=gradeFor(pct);
    return `<tr><td>${esc(m.name)}</td><td style="text-align:center">${max}</td><td style="text-align:center">${got}</td><td style="text-align:center">${pct}%</td><td style="text-align:center"><span class="grade-pill" style="background:${g.color}">${g.g}</span></td></tr>`;
  }).join('') || `<tr><td colspan="5" style="text-align:center;color:var(--muted)">Assessment score shown in total below</td></tr>`;
  app().innerHTML=topbar()+`<div class="app-shell">
    <div class="action-bar no-print"><button class="btn btn-gold" onclick="window.print()">🖨 Print / Save PDF</button><button class="btn btn-ghost" onclick="openCourse('${c.id}')">← Course</button></div>
    <div class="sheet">
      <div class="sheet-head"><img src="${LOGO}"><div class="sh-txt"><h2>${esc(DB.settings.universityName)}</h2><p>${esc(DB.settings.universitySub)} · Online Learning Division</p></div></div>
      <div class="sheet-title">STATEMENT OF MARKS - ${esc(sem.name).toUpperCase()}</div>
      <div class="sheet-body">
        <div class="info-grid">
          <div class="r"><span>Student Name</span><b>${esc(s.name)}</b></div>
          <div class="r"><span>Enrolment No.</span><b>${esc(s.id)}</b></div>
          <div class="r"><span>Programme</span><b>${esc(c.title)}</b></div>
          <div class="r"><span>Semester</span><b>${esc(sem.name)}</b></div>
          <div class="r"><span>Assessment Date</span><b>${a.date}</b></div>
          <div class="r"><span>Result</span><b style="color:${a.passed?'var(--ok)':'var(--warn)'}">${a.passed?'PASS':'FAIL'}</b></div>
        </div>
        <table class="marks"><thead><tr><th>Module / Component</th><th style="text-align:center">Max</th><th style="text-align:center">Obtained</th><th style="text-align:center">%</th><th style="text-align:center">Grade</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>TOTAL</td><td style="text-align:center">${A.questions.length}</td><td style="text-align:center">${a.correct}</td><td style="text-align:center">${a.pct}%</td><td style="text-align:center"><span class="grade-pill" style="background:${a.gradeColor}">${a.grade}</span></td></tr></tfoot></table>
        <p style="font-size:12px;color:var(--muted);margin-top:16px">Grading: A (≥${gs.A}) · B (${gs.B}–${gs.A-1}) · C (${gs.C}–${gs.B-1}) · D (${gs.D}–${gs.C-1}) · F (below ${gs.D}). Minimum ${A.passMark}% required to pass.</p>
      </div>
      <div class="sheet-foot"><div>Generated online on ${a.date}<br>Verification ID: ${a.certId}</div><div class="sign"><div class="line">${esc(DB.settings.sign2)}</div>MiyeeUpskill</div></div>
    </div></div>`;
}

function certSignatures(st){
  const n=st.signCount||3;
  let out='';
  for(let i=1;i<=n;i++){
    const img=st['sigImg'+i], name=st['sign'+i]||'';
    out+=`<div class="s"><div class="sig-img">${img?`<img src="${img}">`:''}</div><div class="name">${esc(name)}</div></div>`;
  }
  return out;
}
function finalCertData(sid,c){
  const sems=courseSemesters(c);
  const atts=sems.map(sem=>getSemAttempt(sid,c.id,sem.id)).filter(Boolean);
  const last=atts[atts.length-1];
  return last?{date:last.date,certId:last.certId}:{date:today(),certId:certId()};
}
function renderCertificate(){
  const s=S.user, c=findCourse(S.courseId), a=finalCertData(s.id,c);
  const st=DB.settings;
  const photo = s.photo ? `<img src="${s.photo}">` : 'STUDENT<br>PHOTO';
  const photoBox = st.showPhoto!==false ? `<div class="cert-photo">${photo}</div>` : '';
  const govBlock = st.showGovId!==false ? `<div class="cert-idblock">Identification Number (Voter ID card Number / Passport Number / Driving License Number / Any other Govt ID proof Number):<span>${esc(s.govId||'________________________')}</span></div>` : '';
  const verifyLine = st.showVerify!==false ? `<div class="cert-verify">Certificate ID: ${a.certId} · Issued on ${a.date}${st.verifyUrl?' · Verify at '+esc(st.verifyUrl):''}</div>` : '';
  app().innerHTML=topbar()+`<div class="app-shell">
    <div class="demo-note no-print">🔒 <b>Privacy note:</b> This system runs entirely on this device. No student data is transmitted to any external server. All information stays local and under MiyeeUpskill's control.</div>
    <div class="action-bar no-print"><button class="btn btn-gold" onclick="window.print()">🖨 Print / Download Certificate</button><button class="btn btn-ghost" onclick="openCourse('${c.id}')">← Course</button><button class="btn btn-ghost" onclick="go('dashboard')">Dashboard</button></div>
    <div class="cert-pages">
      <div class="cert-page"><div class="cert-inner">
        <div class="cert-toprow"><div class="cert-logobox"><img src="${CERT_LOGO}"></div>${photoBox}</div>
        <div class="cert-body">
          <p>This is to certify that on successful completion of the requisite programme of study offered by</p>
          <div class="cert-uni-name">${esc(st.universityName||'MIYEEUPSKILL')}<br><span style="font-size:12px;font-weight:400;color:#6a7788">${esc(st.universitySub||'')}</span></div>
          <p>in the school of</p>
          <div class="cert-field big">${esc(c.school||'')}</div>
          <p>the certificate for the programme</p>
          <div class="cert-field big">${esc(c.title)}</div>
          <p>is hereby awarded to</p>
          <div class="cert-field big">${esc(s.name)}</div>
          <p>in recognition of the successful completion of all requirements<br>and assessments of the programme.</p>
          <div class="cert-witness">Awarded on ${a.date} and issued under the authority of MiyeeUpskill.<br>This certificate may be verified online using the Certificate ID below.</div>
          <div class="cert-signs">${certSignatures(st)}</div>
        </div>
      </div></div>
      <div class="cert-page"><div class="cert-inner cert-back">
        <ol>
          <li>Mode of delivery : <span>Online</span></li>
          <li>Date of Admission: <span>${esc(s.admitDate||'-')}</span></li>
          <li>Date of Completion: <span>${a.date}</span></li>
          <li>Name and address of all Learner Support Centres (only for Open and Distance Learning): <span>Not applicable (Online)</span></li>
          <li>Name and address of all Examination Centres: <span>Online Proctored Examination</span></li>
        </ol>
        ${govBlock}
        ${verifyLine}
      </div></div>
    </div></div>`;
}
</script>
<script>
/* ============================================================
   ADMIN CONSOLE, dashboard, courses, students, results, settings
   ============================================================ */
function renderAdmin(){
  const tabs=[["dashboard","Dashboard"],["courses","Course Designer"],["worksheets","Worksheets"],["students","Students"],["results","Results & Reports"],["settings","Settings"]];
  const tabBtns=tabs.map(([k,l])=>`<button class="${S.adminTab===k?'active':''}" onclick="adminTab('${k}')">${l}</button>`).join('');
  let body="";
  if(S.adminTab==='dashboard') body=adminDashboard();
  else if(S.adminTab==='courses') body=adminCourses();
  else if(S.adminTab==='worksheets') body=adminWorksheets();
  else if(S.adminTab==='students') body=adminStudents();
  else if(S.adminTab==='results') body=adminResults();
  else if(S.adminTab==='settings') body=adminSettings();
  app().innerHTML=topbar()+`<div class="app-shell">
    <div class="page-head"><div><div class="crumb">Home / Admin Console</div><h1>Administration &amp; Management</h1></div></div>
    <div class="tabs">${tabBtns}</div>${body}
  </div>`+(S.modal?renderModal():'');
}
function adminTab(t){ S.adminTab=t; render(); }

/* ---------- MENTOR WORKSHEET REVIEW ---------- */
let wsFilter='all';
function adminWorksheets(){
  const wsLessons=allWorksheetLessons();
  const rows=[];
  wsLessons.forEach(({course,sem,lesson})=>{
    DB.students.filter(s=>(s.enrolled||[]).includes(course.id)).forEach(s=>{
      const resp=getWorksheetResponse(s.id,lesson.id);
      if(!resp && wsFilter==='submitted') return;
      if(resp && resp.reviewed && wsFilter==='pending') return;
      if(!resp && wsFilter==='pending') return;
      rows.push({student:s, course, sem, lesson, resp});
    });
  });
  const filtered = wsFilter==='all' ? rows : rows.filter(r=>r.resp || wsFilter==='notsubmitted');
  const trs=filtered.map(r=>{
    const status = !r.resp ? '<span class="pill gray">Not submitted</span>'
      : r.resp.reviewed ? '<span class="pill green">Reviewed</span>'
      : '<span class="pill amber">Pending review</span>';
    return `<tr>
      <td><b>${esc(r.student.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(r.student.id)}</div></td>
      <td>${esc(r.course.title)}</td>
      <td>${esc(r.lesson.title)}</td>
      <td style="text-align:center">${status}</td>
      <td style="text-align:right">${r.resp?`<button class="btn btn-ghost btn-sm" onclick="reviewWorksheet('${r.student.id}','${r.lesson.id}')">${r.resp.reviewed?'View / Edit Feedback':'Review'}</button>`:'<span style="font-size:12px;color:var(--muted)">Waiting on founder</span>'}</td>
    </tr>`;
  }).join('');
  const total=rows.length, submitted=rows.filter(r=>r.resp).length, reviewed=rows.filter(r=>r.resp&&r.resp.reviewed).length;
  return `<div class="stat-row">
    <div class="stat"><div class="n">${total}</div><div class="l">Total Worksheet Assignments</div></div>
    <div class="stat"><div class="n">${submitted}</div><div class="l">Submitted</div></div>
    <div class="stat"><div class="n">${reviewed}</div><div class="l">Reviewed</div></div>
    <div class="stat"><div class="n">${submitted-reviewed}</div><div class="l">Awaiting Review</div></div>
  </div>
  <div class="mini-toolbar">
    <select onchange="wsFilter=this.value;render()" style="padding:9px 13px;border:1.5px solid var(--border);border-radius:8px">
      <option value="all" ${wsFilter==='all'?'selected':''}>All founders</option>
      <option value="submitted" ${wsFilter==='submitted'?'selected':''}>Submitted only</option>
      <option value="pending" ${wsFilter==='pending'?'selected':''}>Pending review</option>
    </select>
  </div>
  <div class="card"><table class="data"><thead><tr><th>Founder</th><th>Programme</th><th>Worksheet</th><th style="text-align:center">Status</th><th style="text-align:right">Action</th></tr></thead>
  <tbody>${trs||`<tr><td colspan=5 class=empty>No worksheets found for this filter</td></tr>`}</tbody></table></div>`;
}
let reviewCtx=null;
function reviewWorksheet(sid,lid){
  const student=findStudent(sid);
  const wsLessons=allWorksheetLessons();
  const match=wsLessons.find(w=>w.lesson.id===lid);
  const resp=getWorksheetResponse(sid,lid);
  reviewCtx={sid,lid,student,lesson:match.lesson,course:match.course,resp};
  S.modal='wsreview'; render();
}
function wsReviewModalBody(){
  const {student,lesson,course,resp}=reviewCtx;
  const answers=(lesson.fields||[]).map((f,fi)=>{
    const ft=f.ftype||'longtext';
    let v=resp.answers[fi];
    let display = (v==null||(''+v).trim()==='') ? '(left blank)' : esc(''+v);
    if(ft==='number' && f.unit && v!=null && (''+v).trim()!=='') display += ' '+esc(f.unit);
    const tag = ft==='computed'?' <span style="font-size:11px;color:var(--muted)">(auto-calculated)</span>':(ft==='number'?' <span style="font-size:11px;color:var(--muted)">(number)</span>':'');
    return `<div style="margin-bottom:14px"><b style="color:var(--jgu-navy);font-size:13.5px">${esc(f.label)}${tag}</b><div style="background:var(--jgu-light);border-radius:8px;padding:10px 12px;margin-top:5px;font-size:14px;white-space:pre-wrap;${ft==='computed'?'font-weight:700':''}">${display}</div></div>`;
  }).join('');
  return `<div style="font-size:13px;color:var(--muted);margin-bottom:14px">${esc(student.name)} (${esc(student.id)}) · ${esc(course.title)} · Submitted ${resp.submittedAt}</div>
  ${answers}
  <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:14px"><b style="color:var(--jgu-navy);font-size:14px">Mentor Feedback</b></div>
  <div class="field"><textarea id="ws-note" rows="4" placeholder="Write feedback for the founder...">${esc(resp.mentorNote||'')}</textarea></div>
  <label style="display:flex;align-items:center;gap:8px;font-size:14px"><input type="checkbox" id="ws-reviewed" ${resp.reviewed?'checked':''}> Mark as reviewed</label>`;
}
function saveWsReview(){
  const note=document.getElementById('ws-note').value;
  const reviewed=document.getElementById('ws-reviewed').checked;
  const {sid,lid}=reviewCtx;
  DB.worksheets[sid][lid].mentorNote=note;
  DB.worksheets[sid][lid].reviewed=reviewed;
  if(saveDB()){ S.modal=null; toast('Feedback saved ✓'); }
  render();
}

/* ---------- DASHBOARD ---------- */
function allAttempts(){
  const out=[];
  Object.entries(DB.attempts).forEach(([sid,byKey])=>Object.entries(byKey).forEach(([key,a])=>{
    const isSem=key.includes('::');
    const cid=isSem?key.split('::')[0]:key;
    out.push({sid,cid,semId:isSem?key.split('::')[1]:null,a});
  }));
  return out;
}
function adminDashboard(){
  const atts=allAttempts();
  const certs=atts.filter(x=>x.a.passed).length;
  const avg=atts.length?Math.round(atts.reduce((s,x)=>s+x.a.pct,0)/atts.length):0;
  const recent=atts.slice(-6).reverse().map(x=>{
    const st=findStudent(x.sid), c=findCourse(x.cid);
    const semName=x.a.semName||'';
    return `<tr><td>${esc(st?.name||x.sid)}</td><td>${esc(c?.title||x.cid)}${semName?' <span style="font-size:11px;color:var(--muted)">('+esc(semName)+')</span>':''}</td><td style="text-align:center">${x.a.pct}%</td><td style="text-align:center"><span class="pill ${x.a.passed?'green':'red'}">${x.a.passed?'Pass':'Fail'}</span></td><td>${x.a.date}</td></tr>`;
  }).join('') || `<tr><td colspan="5" class="empty">No assessments taken yet</td></tr>`;
  return `<div class="stat-row">
    <div class="stat"><div class="n">${DB.students.length}</div><div class="l">Total Students</div></div>
    <div class="stat"><div class="n">${DB.courses.length}</div><div class="l">Active Programmes</div></div>
    <div class="stat"><div class="n">${certs}</div><div class="l">Certificates Issued</div></div>
    <div class="stat"><div class="n">${avg}%</div><div class="l">Avg. Assessment Score</div></div>
  </div>
  <div class="card"><div class="card-h">Recent Assessment Activity</div>
    <table class="data"><thead><tr><th>Student</th><th>Programme</th><th style="text-align:center">Score</th><th style="text-align:center">Result</th><th>Date</th></tr></thead><tbody>${recent}</tbody></table>
  </div>`;
}

/* ---------- COURSE DESIGNER (semester-aware) ---------- */
function adminCourses(){
  const rows=DB.courses.map(c=>{
    const sems=courseSemesters(c);
    const semRows=sems.map((sem,si)=>`<tr style="background:#fbfcfe">
      <td style="padding-left:28px">↳ ${esc(sem.name)}</td>
      <td style="text-align:center">${semLessonCount(sem)} lessons</td>
      <td style="text-align:center">${sem.assessment.questions.length} MCQs</td>
      <td style="text-align:center">-</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="editSemester('${c.id}','${sem.id}')">Content</button>
        <button class="btn btn-ghost btn-sm" onclick="editAssessment('${c.id}','${sem.id}')">Assessment</button>
        ${sems.length>1?`<button class="btn btn-danger btn-sm" onclick="deleteSemester('${c.id}','${sem.id}')">✕</button>`:''}
      </td></tr>`).join('');
    return `<tr>
      <td><b>${esc(c.title)}</b><div style="font-size:11px;color:var(--muted)">${esc(c.school||'')} · ${sems.length} semester(s)</div></td>
      <td style="text-align:center">${esc(c.duration)}</td>
      <td style="text-align:center">${lessonCount(c)}</td>
      <td style="text-align:center">${DB.students.filter(s=>(s.enrolled||[]).includes(c.id)).length}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="editCourse('${c.id}')">Edit Info</button>
        <button class="btn btn-ghost btn-sm" onclick="addSemester('${c.id}')">+ Semester</button>
        <button class="btn btn-danger btn-sm" onclick="deleteCourse('${c.id}')">Delete</button>
      </td></tr>${semRows}`;
  }).join('');
  return `<div class="mini-toolbar"><h3 style="color:var(--jgu-navy);margin-right:auto">All Programmes</h3><button class="btn btn-gold" onclick="editCourse(null)">+ New Course</button></div>
  <div class="card"><table class="data"><thead><tr><th>Programme / Semester</th><th style="text-align:center">Duration / Lessons</th><th style="text-align:center">Total Lessons / MCQs</th><th style="text-align:center">Enrolled</th><th style="text-align:right">Actions</th></tr></thead>
  <tbody>${rows||`<tr><td colspan=5 class=empty>No courses yet</td></tr>`}</tbody></table></div>
  <p style="font-size:12px;color:var(--muted);margin-top:10px">Each programme has one or more semesters. Students must pass each semester's assessment in order; the final certificate unlocks only after all semesters are passed.</p>`;
}
function deleteCourse(id){
  if(!confirm('Delete this course and all its content? This cannot be undone.')) return;
  DB.courses=DB.courses.filter(c=>c.id!==id);
  DB.students.forEach(s=>s.enrolled=(s.enrolled||[]).filter(x=>x!==id));
  saveDB(); toast('Course deleted'); render();
}
function addSemester(cid){
  const c=findCourse(cid), sems=courseSemesters(c);
  const n=sems.length+1;
  c.semesters.push({id:c.id+'_s'+n+'_'+Date.now().toString(36),name:'Semester '+n,modules:[],assessment:{title:'Semester '+n+' Assessment',passMark:(DB.settings.defaultPassMark||50),durationMins:20,questions:[]}});
  saveDB(); toast('Semester '+n+' added'); render();
}
function deleteSemester(cid,semId){
  const c=findCourse(cid);
  if(courseSemesters(c).length<=1){ toast('A course needs at least one semester','err'); return; }
  if(!confirm('Delete this semester and its content?')) return;
  c.semesters=c.semesters.filter(s=>s.id!==semId);
  saveDB(); toast('Semester deleted'); render();
}

/* Course INFO editor (title/school/etc only, semesters edited separately) */
let edCourse=null;
function editCourse(id){
  if(id){ edCourse=JSON.parse(JSON.stringify(findCourse(id))); }
  else{ const pm=(DB.settings&&DB.settings.defaultPassMark)||50; const cid=uid('c');
    edCourse={id:cid,title:"",tag:"Semester Program",school:"",duration:"1 Year",credits:12,level:"Postgraduate",desc:"",
      semesters:[{id:cid+'_s1',name:'Semester 1',modules:[],assessment:{title:'Semester 1 Assessment',passMark:pm,durationMins:20,questions:[]}}]};
  }
  S.modal='course'; render();
}
function courseModalBody(){
  const c=edCourse;
  const semList=courseSemesters(c).map(s=>`<div class="side-stat"><span>${esc(s.name)}</span><b>${semLessonCount(s)} lessons · ${s.assessment.questions.length} MCQs</b></div>`).join('');
  return `<div class="field"><label>Course Title</label><input id="ec-title" value="${esc(c.title)}"></div>
  <div class="field row2"><div><label>School / Faculty (shown on certificate)</label><input id="ec-school" value="${esc(c.school)}"></div><div><label>Type / Tag</label><input id="ec-tag" value="${esc(c.tag)}"></div></div>
  <div class="field row2"><div><label>Duration</label><input id="ec-dur" value="${esc(c.duration)}"></div><div><label>Credits</label><input id="ec-cr" type="number" value="${c.credits}"></div></div>
  <div class="field"><label>Level</label><input id="ec-lvl" value="${esc(c.level)}"></div>
  <div class="field"><label>Description</label><textarea id="ec-desc" rows="3">${esc(c.desc)}</textarea></div>
  <div style="background:var(--jgu-light);border-radius:8px;padding:12px;font-size:13px"><b style="color:var(--jgu-navy)">Semesters</b> (manage content &amp; assessment from the course list after saving)${semList||'<div style="color:var(--muted);margin-top:6px">New course starts with Semester 1.</div>'}</div>`;
}
function saveCourseModal(){
  commitCourseFields();

/* ---- CSV parser (handles quoted fields, commas, escaped quotes) ---- */
function parseCSVLine(line){
  const out=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function importCSV(inp){
  const f=inp.files[0]; if(!f) return;
  const msg=document.getElementById('csv-msg');
  const r=new FileReader();
  r.onload=e=>{
    try{
      commitAssessTop();
      let text=e.target.result.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      let lines=text.split('\n').filter(l=>l.trim()!=='');
      if(!lines.length){ msg.innerHTML='<span style="color:var(--warn)">Empty file.</span>'; return; }
      // detect & skip header (if first row's "correct" cell isn't a/b/c/d)
      const first=parseCSVLine(lines[0]);
      const looksHeader = !/^[abcd1-4]$/i.test((first[6]||'').trim());
      if(looksHeader) lines=lines.slice(1);
      if(lines.length>100){ msg.innerHTML='<span style="color:var(--warn)">Max 100 questions. Found '+lines.length+'. Import stopped.</span>'; return; }
      const parsed=[]; const errs=[];
      lines.forEach((ln,idx)=>{
        const c=parseCSVLine(ln);
        if(c.length<7){ errs.push('Row '+(idx+1)+': too few columns'); return; }
        const q=c[1], o1=c[2],o2=c[3],o3=c[4],o4=c[5];
        let corr=(c[6]||'').toLowerCase();
        const map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
        if(!(corr in map)){ errs.push('Row '+(idx+1)+': bad correct option "'+c[6]+'"'); return; }
        if(!q||!o1||!o2||!o3||!o4){ errs.push('Row '+(idx+1)+': missing question/option'); return; }
        const marks=c[7]!==undefined&&c[7]!==''?(parseFloat(c[7])||0):1;
        const neg=c[8]!==undefined&&c[8]!==''?(parseFloat(c[8])||0):0;
        parsed.push({q,opts:[o1,o2,o3,o4],correct:map[corr],marks,neg});
      });
      if(!parsed.length){ msg.innerHTML='<span style="color:var(--warn)">No valid rows. '+errs.slice(0,3).join('; ')+'</span>'; return; }
      // ask replace or append
      const replace = edAssess.questions.length===0 ? true : confirm('Import '+parsed.length+' questions.\n\nOK = REPLACE existing '+edAssess.questions.length+' questions\nCancel = ADD to existing');
      if(replace) edAssess.questions=parsed; else edAssess.questions=edAssess.questions.concat(parsed);
      const warn = errs.length?' ('+errs.length+' row(s) skipped)':'';
      toast('Imported '+parsed.length+' questions ✓');
      render();
      setTimeout(()=>{const m2=document.getElementById('csv-msg');if(m2)m2.innerHTML='<span style="color:var(--ok)">✓ Imported '+parsed.length+' questions'+warn+'</span>'+(errs.length?'<div style="color:var(--warn);font-size:11px;margin-top:4px">'+errs.slice(0,5).join('<br>')+'</div>':'');},50);
    }catch(ex){ msg.innerHTML='<span style="color:var(--warn)">Error reading CSV: '+ex.message+'</span>'; }
  };
  r.readAsText(f);
}
