  const cbs=DB.courses.map(c=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px"><input type="checkbox" value="${c.id}" ${(s.enrolled||[]).includes(c.id)?'checked':''} class="enr-cb"> ${esc(c.title)}</label>`).join('');
  return `<div class="field row2"><div><label>Enrolment ID</label><input id="es-id" value="${esc(s.id)}"></div><div><label>Admission Date</label><input id="es-admit" value="${esc(s.admitDate)}"></div></div>
  <div class="field"><label>Full Name</label><input id="es-name" value="${esc(s.name)}"></div>
  <div class="field row2"><div><label>Email (login)</label><input id="es-email" value="${esc(s.email)}"></div><div><label>Password</label><input id="es-pass" value="${esc(s.pass)}"></div></div>
  <div class="field row2"><div><label>Phone</label><input id="es-phone" value="${esc(s.phone)}"></div><div><label>Govt ID No. (for certificate)</label><input id="es-gov" value="${esc(s.govId)}"></div></div>
  <div class="field"><label>Student Photo (for certificate)</label><input type="file" accept="image/*" onchange="pickPhoto(this)">${s.photo?`<div style="margin-top:8px"><img src="${s.photo}" style="height:70px;border:1px solid var(--border);border-radius:6px"></div>`:''}</div>
  <div class="field"><label>Enrol in Programmes</label>${cbs||'<span style="color:var(--muted)">No courses available</span>'}</div>`;
}
function pickPhoto(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ edStudent.photo=e.target.result; commitStudentFields(); render(); };
  r.readAsDataURL(f);
}
function commitStudentFields(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
  if(document.getElementById('es-name')){
    edStudent.id=g('es-id'); edStudent.admitDate=g('es-admit'); edStudent.name=g('es-name');
    edStudent.email=g('es-email'); edStudent.pass=g('es-pass'); edStudent.phone=g('es-phone'); edStudent.govId=g('es-gov');
    edStudent.enrolled=[...document.querySelectorAll('.enr-cb:checked')].map(cb=>cb.value);
  }
}
function saveStudentModal(){
  commitStudentFields();
  if(!edStudent.name.trim()||!edStudent.email.trim()){ toast('Name and email required','err'); return; }
  const dup=DB.students.find(s=>s.email.toLowerCase()===edStudent.email.toLowerCase()&&s.id!==edStudent.id);
  if(dup){ toast('Email already in use','err'); return; }
  const i=DB.students.findIndex(s=>s.id===edStudent.id);
  if(i>=0) DB.students[i]=edStudent; else DB.students.push(edStudent);
  saveDB(); S.modal=null; toast('Student saved ✓'); render();
}

/* ---------- RESULTS & REPORTS ---------- */
function adminResults(){
  const atts=allAttempts();
  const rows=atts.map(x=>{
    const s=findStudent(x.sid), c=findCourse(x.cid), a=x.a;
    return `<tr><td><b>${esc(s?.id||x.sid)}</b></td><td>${esc(s?.name||'-')}</td><td>${esc(c?.title||x.cid)}</td><td>${esc(a.semName||'-')}</td>
      <td style="text-align:center">${a.correct}/${a.total}</td><td style="text-align:center">${a.pct}%</td>
      <td style="text-align:center"><span class="grade-pill" style="background:${a.gradeColor}">${a.grade}</span></td>
      <td style="text-align:center"><span class="pill ${a.passed?'green':'red'}">${a.passed?'Pass':'Fail'}</span></td>
      <td>${a.date}</td></tr>`;
  }).join('');
  return `<div class="mini-toolbar"><h3 style="color:var(--jgu-navy);margin-right:auto">All Assessment Results (per semester)</h3><button class="btn btn-ghost" onclick="exportCSV()">⬇ Export CSV</button></div>
  <div class="card"><table class="data"><thead><tr><th>Enrol ID</th><th>Student</th><th>Programme</th><th>Semester</th><th style="text-align:center">Score</th><th style="text-align:center">%</th><th style="text-align:center">Grade</th><th style="text-align:center">Result</th><th>Date</th></tr></thead>
  <tbody>${rows||`<tr><td colspan=9 class=empty>No results yet</td></tr>`}</tbody></table></div>`;
}
function exportCSV(){
  const atts=allAttempts();
  if(!atts.length){ toast('No results to export','err'); return; }
  let csv="Enrolment ID,Student Name,Email,Programme,Semester,Correct,Total,Percentage,Grade,Result,Date\n";
  atts.forEach(x=>{
    const s=findStudent(x.sid), c=findCourse(x.cid), a=x.a;
    csv+=[s?.id||x.sid,s?.name||'',s?.email||'',c?.title||'',a.semName||'',a.correct,a.total,a.pct+'%',a.grade,a.passed?'Pass':'Fail',a.date].map(v=>`"${(v+'').replace(/"/g,'""')}"`).join(',')+"\n";
  });
  const blob=new Blob([csv],{type:'text/csv'}), url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='MiyeeUpskill_Results_'+Date.now()+'.csv'; a.click();
  URL.revokeObjectURL(url); toast('CSV exported ✓');
}

/* ---------- SETTINGS (comprehensive hub) ---------- */
let settingsTab='institution';
function setSettingsTab(t){ settingsTab=t; render(); }
function adminSettings(){
  const s=DB.settings;
  const sub=[["institution","Institution & Certificate"],["grading","Grading & Assessment"],["admins","Admin Accounts"],["data","Data & Storage"]];
  const subBtns=sub.map(([k,l])=>`<button class="${settingsTab===k?'active':''}" onclick="setSettingsTab('${k}')" style="font-size:13px">${l}</button>`).join('');
  let body="";
  if(settingsTab==='institution') body=settingsInstitution();
  else if(settingsTab==='grading') body=settingsGrading();
  else if(settingsTab==='admins') body=settingsAdmins();
  else if(settingsTab==='data') body=settingsData();
  return `<div class="tabs" style="margin-bottom:18px">${subBtns}</div>${body}`;
}

function settingsInstitution(){
  const s=DB.settings;
  const chk=(v)=>v?'checked':'';
  const sigSlot=(n)=>{
    const img=s['sigImg'+n];
    return `<div style="border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;${s.signCount<n?'opacity:.4':''}">
      <div style="font-size:12px;font-weight:600;color:var(--jgu-navy);margin-bottom:8px">Signature ${n}: ${esc(s['sign'+n]||'')}</div>
      <div style="height:56px;display:flex;align-items:center;justify-content:center;background:var(--jgu-light);border-radius:6px;margin-bottom:8px">${img?`<img src="${img}" style="max-height:52px;max-width:100%">`:'<span style="font-size:11px;color:var(--muted)">No image</span>'}</div>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;margin:0">Upload<input type="file" accept="image/*" onchange="uploadSig(${n},this)" style="display:none"></label>
      ${img?`<button class="btn btn-danger btn-sm" onclick="clearSig(${n})">Remove</button>`:''}
    </div>`;
  };
  return `<div class="card" style="max-width:680px"><div class="card-h">Institution & Certificate Details</div><div class="card-b">
    <div class="field"><label>University Name</label><input id="set-uni" value="${esc(s.universityName)}"></div>
    <div class="field"><label>Subtitle</label><input id="set-sub" value="${esc(s.universitySub)}"></div>
    <div class="field row2"><div><label>Signatory 1 (left)</label><input id="set-s1" value="${esc(s.sign1)}"></div><div><label>Signatory 2 (centre)</label><input id="set-s2" value="${esc(s.sign2)}"></div></div>
    <div class="field row2"><div><label>Signatory 3 (right)</label><input id="set-s3" value="${esc(s.sign3)}"></div><div><label>Certificate ID Prefix</label><input id="set-prefix" value="${esc(s.certPrefix)}"></div></div>
    <div class="field"><label>Certificate Verification URL</label><input id="set-verify" value="${esc(s.verifyUrl)}"></div>
    <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:14px"><b style="color:var(--jgu-navy);font-size:14px">Signatures on Certificate</b></div>
    <div class="field"><label>Number of signatures</label><select id="set-signcount" onchange="changeSignCount(this.value)"><option value="2" ${s.signCount==2?'selected':''}>2 signatures</option><option value="3" ${s.signCount==3?'selected':''}>3 signatures</option></select></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px">${sigSlot(1)}${sigSlot(2)}${sigSlot(3)}</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px">Upload signature images (PNG with transparent background works best). Edit the signatory names above and click Save to update the labels.</p>
    <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:14px"><b style="color:var(--jgu-navy);font-size:14px">Certificate Display Options</b></div>
    <label style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px"><input type="checkbox" id="set-photo" ${chk(s.showPhoto)}> Show student photo box on certificate</label>
    <label style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px"><input type="checkbox" id="set-gov" ${chk(s.showGovId)}> Show Government ID number on certificate</label>
    <label style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px"><input type="checkbox" id="set-vshow" ${chk(s.showVerify)}> Show verification URL / certificate ID line</label>
    <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:14px"><b style="color:var(--jgu-navy);font-size:14px">Student Access</b></div>
    <label style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px"><input type="checkbox" id="set-signup" ${chk(s.allowSignup)}> Allow students to self-register (create their own accounts)</label>
    <p style="font-size:12px;color:var(--muted)">When off, only administrators can create student accounts and the "Create an account" link is hidden.</p>
    <div style="margin-top:16px"><button class="btn btn-gold" onclick="saveSettingsInstitution()">Save Changes</button></div>
  </div></div>`;
}
function changeSignCount(v){ commitInstFields(); DB.settings.signCount=parseInt(v)||3; render(); }
function uploadSig(n,inp){
  const f=inp.files[0]; if(!f) return;
  if(f.size>500*1024){ toast('Signature image too large (max 500 KB)','err'); return; }
  const r=new FileReader();
  r.onload=e=>{ commitInstFields(); DB.settings['sigImg'+n]=e.target.result; if(saveDB()) toast('Signature '+n+' uploaded ✓'); render(); };
  r.readAsDataURL(f);
}
function clearSig(n){ DB.settings['sigImg'+n]=""; saveDB(); toast('Signature '+n+' removed'); render(); }
function commitInstFields(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
  const c=id=>{const e=document.getElementById(id);return e?e.checked:undefined;};
  if(document.getElementById('set-uni')){
    Object.assign(DB.settings,{
      universityName:g('set-uni'),universitySub:g('set-sub'),
      sign1:g('set-s1'),sign2:g('set-s2'),sign3:g('set-s3'),
      certPrefix:g('set-prefix')||'MU',verifyUrl:g('set-verify'),
      showPhoto:c('set-photo'),showGovId:c('set-gov'),showVerify:c('set-vshow'),allowSignup:c('set-signup')
    });
  }
}
function saveSettingsInstitution(){
  commitInstFields();
  if(saveDB()) toast('Institution settings saved ✓');
  render();
}

function settingsGrading(){
  const s=DB.settings, gs=s.gradeScale;
  return `<div class="card" style="max-width:680px"><div class="card-h">Grading Scale (minimum % for each grade)</div><div class="card-b">
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Set the minimum percentage required for each grade. Anything below the D threshold is an F (Fail). Thresholds must decrease from A to D.</p>
    <div class="field" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
      <div><label>Grade A ≥</label><input id="gs-a" type="number" value="${gs.A}"></div>
      <div><label>Grade B ≥</label><input id="gs-b" type="number" value="${gs.B}"></div>
      <div><label>Grade C ≥</label><input id="gs-c" type="number" value="${gs.C}"></div>
      <div><label>Grade D ≥</label><input id="gs-d" type="number" value="${gs.D}"></div>
    </div>
    <div style="background:var(--jgu-light);border-radius:8px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:16px">
      Preview: A ≥ ${gs.A}% · B ${gs.B}–${gs.A-1}% · C ${gs.C}–${gs.B-1}% · D ${gs.D}–${gs.C-1}% · F below ${gs.D}%
    </div>
    <div style="border-top:1px solid var(--border);margin:4px 0 14px;padding-top:14px"><b style="color:var(--jgu-navy);font-size:14px">Assessment Defaults</b></div>
    <div class="field row2"><div><label>Default Pass Mark (%)</label><input id="gs-pass" type="number" value="${s.defaultPassMark}"></div><div><label>Default Negative Marking (per wrong answer)</label><input id="gs-neg" type="number" step="0.25" value="${s.defaultNeg}"></div></div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">These defaults apply to newly created assessments and questions. Existing assessments keep their own values.</p>
    <button class="btn btn-gold" onclick="saveSettingsGrading()">Save Grading Settings</button>
  </div></div>`;
}
function saveSettingsGrading(){
  const n=id=>parseFloat(document.getElementById(id).value);
  const A=n('gs-a'),B=n('gs-b'),C=n('gs-c'),D=n('gs-d');
  if([A,B,C,D].some(v=>isNaN(v)||v<0||v>100)){ toast('Grade thresholds must be 0–100','err'); return; }
  if(!(A>B && B>C && C>D)){ toast('Thresholds must decrease: A > B > C > D','err'); return; }
  DB.settings.gradeScale={A,B,C,D};
  DB.settings.defaultPassMark=Math.max(0,Math.min(100,n('gs-pass')||50));
  DB.settings.defaultNeg=Math.max(0,n('gs-neg')||0);
  if(saveDB()) toast('Grading settings saved ✓');
  render();
}

function settingsAdmins(){
  const rows=DB.admins.map((a,i)=>`<tr>
    <td>${esc(a.name)}</td><td>${esc(a.email)}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn btn-ghost btn-sm" onclick="editAdmin(${i})">Edit</button>
      ${DB.admins.length>1?`<button class="btn btn-danger btn-sm" onclick="deleteAdmin(${i})">Delete</button>`:'<span style="font-size:11px;color:var(--muted)">last admin</span>'}
    </td></tr>`).join('');
  return `<div class="mini-toolbar"><h3 style="color:var(--jgu-navy);margin-right:auto">Administrator Accounts</h3><button class="btn btn-gold" onclick="editAdmin(null)">+ Add Admin</button></div>
  <div class="card" style="max-width:680px"><table class="data"><thead><tr><th>Name</th><th>Email (login)</th><th style="text-align:right">Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p style="font-size:12px;color:var(--muted);margin-top:12px;max-width:680px">⚠ Passwords are stored locally in plain text in this offline build. In the cloud/production version, passwords will be securely hashed. Do not reuse important passwords here.</p>`;
}
let edAdmin=null, edAdminIdx=null;
function editAdmin(i){
  edAdminIdx=i;
  edAdmin = i!=null ? {...DB.admins[i]} : {name:"",email:"",pass:""};
  S.modal='admin'; render();
}
function adminModalBody(){
  const a=edAdmin;
  return `<div class="field"><label>Name</label><input id="ad-name" value="${esc(a.name)}"></div>
  <div class="field"><label>Email (login)</label><input id="ad-email" value="${esc(a.email)}"></div>
  <div class="field"><label>Password</label><input id="ad-pass" value="${esc(a.pass)}" placeholder="Set a password"></div>`;
}
function saveAdminModal(){
  const g=id=>document.getElementById(id).value.trim();
  const name=g('ad-name'),email=g('ad-email'),pass=g('ad-pass');
  if(!name||!email||!pass){ toast('All fields required','err'); return; }
  const dup=DB.admins.find((x,idx)=>x.email.toLowerCase()===email.toLowerCase()&&idx!==edAdminIdx);
  if(dup){ toast('Email already used by another admin','err'); return; }
  if(edAdminIdx!=null) DB.admins[edAdminIdx]={name,email,pass};
  else DB.admins.push({name,email,pass});
  if(saveDB()){ S.modal=null; toast('Admin saved ✓'); }
  render();
}
function deleteAdmin(i){
  if(DB.admins.length<=1){ toast('Cannot delete the last admin','err'); return; }
  if(!confirm('Delete this administrator account?')) return;
  DB.admins.splice(i,1); saveDB(); toast('Admin deleted'); render();
}

function settingsData(){
  const u=storageUsage();
  const barColor = u.pct>85?'var(--warn)':u.pct>60?'#b7791f':'var(--ok)';
  const counts=`${DB.courses.length} courses · ${DB.students.length} students · ${allAttempts().length} attempts`;
  return `<div class="card" style="max-width:680px"><div class="card-h">Storage Usage</div><div class="card-b">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>${u.kb} KB used of ~${(u.cap/1024/1024).toFixed(0)} MB</span><span style="color:${barColor};font-weight:700">${u.pct}%</span></div>
    <div class="progress-bar" style="height:12px;margin-bottom:8px"><i style="width:${u.pct}%;background:${barColor}"></i></div>
    <div style="font-size:12.5px;color:var(--muted)">${counts}</div>
    ${u.pct>75?`<div style="margin-top:10px;background:#fdf0e8;border:1px solid #f0c9ad;border-radius:8px;padding:10px;font-size:12.5px;color:#8a4b1e">⚠ Storage is filling up. Student photos and any base64 videos take the most space. Export a backup and remove large media if you approach 100%.</div>`:''}
  </div></div>

  <div class="card" style="max-width:680px;margin-top:20px"><div class="card-h">Backup & Restore</div><div class="card-b">
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:14px">All data lives on this device only. Use backup to move everything to another computer, or as a safety copy. Restoring <b>replaces</b> all current data.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-ghost" onclick="backupData()">⬇ Backup All Data (JSON)</button>
      <label class="btn btn-ghost" style="cursor:pointer;margin:0">⬆ Restore from Backup<input type="file" accept=".json,application/json" onchange="restoreData(this)" style="display:none"></label>
    </div>
    <div id="restore-msg" style="font-size:12.5px;margin-top:10px"></div>
  </div></div>

  <div class="card" style="max-width:680px;margin-top:20px"><div class="card-h" style="color:var(--warn)">Danger Zone</div><div class="card-b">
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:14px">Reset erases all courses, students, and results and restores the original demo data. Export a backup first if unsure.</p>
    <button class="btn btn-danger" onclick="resetData()">Reset to Demo Data</button>
  </div></div>`;
}
function backupData(){
  try{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob);
    const a=document.createElement('a'); const stamp=new Date().toISOString().slice(0,10);
    a.href=url; a.download='MiyeeUpskill_Backup_'+stamp+'.json'; a.click(); URL.revokeObjectURL(url);
    toast('Backup downloaded ✓');
  }catch(e){ toast('Backup failed','err'); }
}
function restoreData(inp){
  const f=inp.files[0]; if(!f) return;
  const msg=document.getElementById('restore-msg');
  const r=new FileReader();
  r.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      const mig=migrateDB(parsed);
      if(!mig || !Array.isArray(mig.courses) || !Array.isArray(mig.students) || !Array.isArray(mig.admins)){
        msg.innerHTML='<span style="color:var(--warn)">Invalid backup file, missing core data.</span>'; return;
      }
      if(!confirm('Restore this backup? It will REPLACE all current data ('+DB.courses.length+' courses, '+DB.students.length+' students).')) { msg.innerHTML=''; return; }
      DB=mig;
      if(saveDB()){ toast('Data restored ✓'); render();
        setTimeout(()=>{const m2=document.getElementById('restore-msg');if(m2)m2.innerHTML='<span style="color:var(--ok)">✓ Restored '+DB.courses.length+' courses, '+DB.students.length+' students, '+DB.admins.length+' admins</span>';},60);
      }
    }catch(ex){ msg.innerHTML='<span style="color:var(--warn)">Could not read file: '+esc(ex.message)+'</span>'; }
  };
  r.readAsText(f);
}
function resetData(){ if(!confirm('Reset ALL data back to demo defaults? This erases your courses and students.')) return; DB=migrateDB(seedDB()); saveDB(); toast("Reset to demo data"); settingsTab='institution'; render(); }

/* ---------- MODAL RENDERER ---------- */
function renderModal(){
  let title="",body="",save="",wide="";
  if(S.modal==='course'){ title=edCourse.title?'Edit Course Info':'New Course'; body=courseModalBody(); save='saveCourseModal()'; wide='wide'; }
  else if(S.modal==='semester'){ title='Semester Content: '+esc(edSem.name); body=semesterModalBody(); save='saveSemesterModal()'; wide='wide'; }
  else if(S.modal==='lesson'){ title='Lesson'; body=lessonModalBody(); save='saveLessonModal()'; }
  else if(S.modal==='assess'){ title='Assessment Builder'; body=assessModalBody(); save='saveAssessModal()'; wide='wide'; }
  else if(S.modal==='student'){ title=edStudent.name?'Edit Student':'Add Student'; body=studentModalBody(); save='saveStudentModal()'; }
  else if(S.modal==='admin'){ title=edAdminIdx!=null?'Edit Admin':'Add Admin'; body=adminModalBody(); save='saveAdminModal()'; }
  else if(S.modal==='wsreview'){ title='Worksheet Review'; body=wsReviewModalBody(); save='saveWsReview()'; wide='wide'; }
  const closeTo = S.modal==='lesson' ? "S.modal='semester';render()" : "S.modal=null;render()";
  return `<div class="modal-bg" onclick="if(event.target===this){${closeTo}}"><div class="modal ${wide}">
    <div class="modal-h"><h3>${title}</h3><button class="x" onclick="${closeTo}">×</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="${closeTo}">Cancel</button><button class="btn btn-gold" onclick="${save}">Save</button></div>
  </div></div>`;
}

/* ---------- BOOT ---------- */
render();
</script>
</body></html>
