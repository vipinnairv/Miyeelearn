<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - MiyeeUpskill</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card" style="max-width:460px">
    <div class="login-right" style="flex:1">
      <span class="lg-logo" style="align-self:flex-start;margin-bottom:20px"><img src="assets/logo.svg" style="height:36px"></span>
      <h2>Reset your password</h2>
      <div class="sub">Enter your email and we'll send you a reset link.</div>
      <form id="forgot-form">
        <div class="field"><label>Email</label><input id="fp-email" type="email" required placeholder="you@email.com"></div>
        <button type="submit" class="btn" style="width:100%;padding:12px;font-size:15px">Send Reset Link &rarr;</button>
      </form>
      <div id="fp-msg"></div>
      <div style="text-align:center;margin-top:14px"><a onclick="location.href='index.html'" style="font-size:13px">&larr; Back to sign in</a></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('fp-email').value.trim();
  const msg = document.getElementById('fp-msg');
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname.replace('forgot.html','reset.html')
  });
  msg.innerHTML = error
    ? `<div class="err">${esc(error.message)}</div>`
    : `<div class="ok-msg">If an account exists for that email, a reset link has been sent.</div>`;
});
</script>
</body>
</html>
